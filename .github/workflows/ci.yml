# Checks every push to main and every pull request: the Go code, that the
# image builds and its den and fx start, and that den runs its container on
# a Linux host with Docker and with Podman.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      # macOS sh reads a UTF-8 character after $name as part of the name.
      - name: Shell scripts are ASCII
        run: "! grep -nP '[^\\x00-\\x7F]' install.sh scripts/*.sh"

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: den:ci
          build-args: |
            DEN_VERSION=ci
            WHISPER_NATIVE=OFF
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run --rm den:ci den version
          docker run --rm den:ci fx --version
          docker run --rm den:ci sh -c 'command -v whisper-cli && command -v lightpanda'

  # den on a Linux host with each container tool, up to the Telegram token.
  host:
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/den" ./cmd/den
      # Outside the checkout, so setup pulls the published image as a new
      # user's would.
      - working-directory: ${{ runner.temp }}
        run: $GITHUB_WORKSPACE/scripts/check-host.sh ${{ matrix.runtime }} "$RUNNER_TEMP/den"
